<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>prompt box</h1>

  <button onclick="checkName()">Click me</button>
  <p id="result"></p>

  <script>
    let topu = "topu";  

    function checkName() {
      let name = prompt("Please enter your name:");

      if (name === topu) {
        document.getElementById("result").innerHTML = "welcome topu";
      } else {
        document.getElementById("result").innerHTML = "new name";
      }
    }
  </script>

</body>
</html>
